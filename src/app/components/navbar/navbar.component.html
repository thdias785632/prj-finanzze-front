<!-- Barra superior: marca à esquerda, avatar com menu à direita -->
<header class="navbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><mat-icon>account_balance_wallet</mat-icon></span>
    <span class="brand-text">Finannze</span>
  </div>

  <div class="user-icon" role="button" tabindex="0" aria-label="Menu do usuário" aria-haspopup="menu" [attr.aria-expanded]="userMenuOpen" (click)="toggleUserMenu()" (keydown.enter)="toggleUserMenu()" (keydown.space)="$event.preventDefault(); toggleUserMenu()">
    <span class="avatar" aria-hidden="true">{{ initial }}</span>

    <div class="dropdown-menu" role="menu" [class.open]="userMenuOpen">
      <div class="dropdown-user" *ngIf="userName">
        <strong>{{ userName }}</strong>
        <span *ngIf="userEmail">{{ userEmail }}</span>
      </div>
      <a class="dropdown-item" role="menuitem" tabindex="0" (click)="goToProfile()" (keydown.enter)="goToProfile()">
        <mat-icon aria-hidden="true">account_circle</mat-icon>
        <span>Perfil</span>
      </a>
      <a class="dropdown-item logout" role="menuitem" tabindex="0" (click)="logout()" (keydown.enter)="logout()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        <span>Sair</span>
      </a>
    </div>
  </div>
</header>
