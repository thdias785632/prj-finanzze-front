<!-- NAVBAR SUPERIOR - SEM HAMBURGER -->
<div class="navbar">
  <!-- Logo/Brand -->
  <div class="brand">
    <span class="brand-text">FINANNZE</span>
  </div>

  <!-- User Menu (direita) -->
  <div class="user-icon" role="button" tabindex="0" aria-label="Menu do usuário" aria-haspopup="menu" [attr.aria-expanded]="userMenuOpen" (click)="toggleUserMenu()" (keydown.enter)="toggleUserMenu()" (keydown.space)="$event.preventDefault(); toggleUserMenu()">
    <mat-icon aria-hidden="true">person</mat-icon>

    <!-- Dropdown do usuário -->
    <div class="dropdown-menu" [class.open]="userMenuOpen">
      <a class="dropdown-item" role="menuitem" tabindex="0" (click)="goToProfile()" (keydown.enter)="goToProfile()">
        <mat-icon>account_circle</mat-icon>
        <span>Perfil</span>
      </a>
      <a class="dropdown-item logout" role="menuitem" tabindex="0" (click)="logout()" (keydown.enter)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </a>
    </div>
  </div>
</div>
