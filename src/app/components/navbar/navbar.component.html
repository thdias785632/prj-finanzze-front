<!-- NAVBAR SUPERIOR - SEM HAMBURGER -->
<div class="navbar">
  <!-- Logo/Brand -->
  <div class="brand">
    <span class="brand-text">FINANNZE</span>
  </div>

  <!-- User Menu (direita) -->
  <div class="user-icon" (click)="toggleUserMenu()">
    <mat-icon aria-hidden="false" aria-label="User icon">person</mat-icon>

    <!-- Dropdown do usuário -->
    <div class="dropdown-menu" [class.open]="userMenuOpen">
      <a class="dropdown-item" (click)="goToProfile()">
        <mat-icon>account_circle</mat-icon>
        <span>Perfil</span>
      </a>
      <a class="dropdown-item logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </a>
    </div>
  </div>
</div>
