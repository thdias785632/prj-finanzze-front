<!-- Navegação inferior: barra branca limpa, aba ativa com "pílula" roxa -->
<nav class="bottom-navigation" aria-label="Navegação principal">
  <a
    *ngFor="let route of routes"
    [routerLink]="route.path"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    [routerLinkActiveOptions]="{exact: route.exact || false}"
    [attr.aria-label]="route.label"
    class="nav-item"
  >
    <span class="icon-wrapper">
      <mat-icon aria-hidden="true">{{ route.icon }}</mat-icon>
    </span>
    <span class="label">{{ route.label }}</span>
  </a>
</nav>
